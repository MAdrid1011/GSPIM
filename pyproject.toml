[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gspim-reference"
version = "0.1.0"
description = "Functional and RTL mechanism reference for GSPIM"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gspim-demo = "gspim.demo:main"

[tool.setuptools]
packages = ["gspim", "gspim.layouts", "reference_model", "integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
